name: Publish release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Build on a GitHub-hosted runner: the firmware is compiled inside the
  # ESP-IDF devcontainer (standard Docker on the hosted runner — no
  # Docker-in-Docker needed on our self-hosted runner). This job has no access
  # to SignServer and produces the unsigned binaries as an artifact.
  build:
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create empty .env file
        run: touch .env
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Build firmware
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            WIFI_SSID=${{ secrets.WIFI_SSID }}
            WIFI_PWD=${{ secrets.WIFI_PWD }}
          runCmd: |
            idf.py -C blinky build
      - name: Upload unsigned firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-unsigned
          if-no-files-found: error
          path: |
            blinky/build/blinky.bin
            blinky/build/bootloader/bootloader.bin
            blinky/build/partition_table/partition-table.bin
            blinky/build/flasher_args.json

  # Sign on the self-hosted runner next to the local SignServer. The mTLS
  # client cert/key are mounted read-only at /home/runner/keys by the host
  # compose file. This job only needs a small toolset (esptool for espsecure,
  # plus jq) — NOT the full ESP-IDF toolchain. The signing private key never
  # leaves SignServer; there is no SIGNING_KEY secret anymore.
  sign:
    needs: build
    runs-on: [self-hosted, linux, local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download unsigned firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-unsigned
      # jq from the distro package (requires root on the runner). esptool
      # (provides espsecure) is installed via uv — a single static binary that
      # manages its own Python, so we don't depend on system pip and get the
      # esptool 5.x that apt does not provide.
      - name: Install signing tools (jq + esptool)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.local/bin"

          # jq: native package
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y jq
          fi

          # espsecure (esptool): via uv
          if ! command -v espsecure >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            uv tool install --quiet esptool
            export PATH="$HOME/.local/bin:$PATH"
          fi

          command -v jq
          command -v espsecure
          espsecure --help >/dev/null 2>&1
      - name: Sign via local SignServer
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd blinky

          # 1. Hash the unsigned app (build/blinky.bin) for SignServer
          openssl dgst -sha256 -binary build/blinky.bin | base64 -w0 \
            > build/blinky.sha256.b64

          # 2. Ask the local SignServer for the signature (mTLS; server cert
          #    is self-signed, hence -k). Only the hash crosses the network.
          curl --fail-with-body --silent --show-error -k \
            --cert /home/runner/keys/client.crt \
            --key /home/runner/keys/client.key \
            -H 'X-Keyfactor-Requested-With: REST' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "{\"data\":\"$(cat build/blinky.sha256.b64)\",\"encoding\":\"BASE64\",\"metaData\":{\"USING_CLIENTSUPPLIED_HASH\":\"true\",\"CLIENTSIDE_HASHDIGESTALGORITHM\":\"SHA-256\"}}" \
            'https://signserver:8443/signserver/rest/v1/workers/PlainSigner/process' \
            > build/signserver-response.json

          # 3. Extract the signer certificate -> public key, and the signature
          jq -r .signerCertificate build/signserver-response.json \
            | base64 -d > build/signer-certificate.der
          openssl x509 -inform DER -in build/signer-certificate.der \
            -pubkey -noout > build/signing_public.pem
          jq -r .data build/signserver-response.json \
            | base64 -d > build/signature.bin

          # 4. Assemble the Secure Boot v2 signature block over the app
          espsecure sign-data --version 2 \
            --pub-key build/signing_public.pem \
            --signature build/signature.bin \
            --output build/blinky.signed.bin \
            build/blinky.bin

          # 5. The published/flashed app is the signed one
          mv build/blinky.signed.bin build/blinky.bin

          # 6. Verify before publishing
          espsecure verify-signature --version 2 \
            --keyfile build/signing_public.pem build/blinky.bin
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: "Blinky Firmware ${{ github.ref_name }}"
          body: ${{ needs.build.outputs.release_body }}
          files: |
            blinky/build/blinky.bin
            blinky/build/bootloader/bootloader.bin
            blinky/build/partition_table/partition-table.bin
            blinky/build/flasher_args.json